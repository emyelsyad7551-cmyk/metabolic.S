<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درع الأيض</title>
<meta name="theme-color" content="#0E6B63">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🛡️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12302D; --muted:#56706A; --teal:#0E6B63; --teal-deep:#0A4F49; --mint:#E2F1EC; --mint-2:#CFE7DF;
  --paper:#F4F7F4; --card:#FFFFFF; --line:#D5E2DC; --saffron:#E3A23B; --saffron-soft:#FBEFD9;
  --ok:#2E8753; --ok-soft:#E1F2E7; --mid:#B7791F; --mid-soft:#FBF0DA; --high:#B83E25; --high-soft:#F8E3DD;
  --shadow:0 1px 0 rgba(18,48,45,.06), 0 8px 24px -16px rgba(18,48,45,.35);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --f-head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Cairo",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6F1EE; --muted:#9DB5AF; --teal:#3FB3A6; --teal-deep:#2A8C81; --mint:#16312D; --mint-2:#1E403B;
    --paper:#0D1B19; --card:#132624; --line:#244441; --saffron:#EBB25A; --saffron-soft:#3A2D16;
    --ok:#5CC08A; --ok-soft:#173326; --mid:#E0A64A; --mid-soft:#382A12; --high:#EE7A60; --high-soft:#3A1C15;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E6F1EE; --muted:#9DB5AF; --teal:#3FB3A6; --teal-deep:#2A8C81; --mint:#16312D; --mint-2:#1E403B;
  --paper:#0D1B19; --card:#132624; --line:#244441; --saffron:#EBB25A; --saffron-soft:#3A2D16;
  --ok:#5CC08A; --ok-soft:#173326; --mid:#E0A64A; --mid-soft:#382A12; --high:#EE7A60; --high-soft:#3A1C15;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0}
h1{font-size:28px;font-weight:800} h2{font-size:22px;font-weight:700} h3{font-size:18px;font-weight:700}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px;min-height:100vh}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:0;background:var(--teal);color:#fff;font-family:var(--f-head);font-weight:700;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.soft{background:var(--mint);color:var(--teal-deep)}
.btn.warn{background:var(--high)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--mint);color:var(--teal-deep);font-size:14px;font-weight:600;border:0}
.field{display:block;margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.input{width:100%;min-height:52px;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-size:18px}
.input:focus{border-color:var(--teal);outline:none}
.pin{letter-spacing:.6em;text-align:center;font-size:24px;direction:ltr}
.code{direction:ltr;text-align:center;text-transform:uppercase;font-size:20px;letter-spacing:.08em}
.err{color:var(--high);font-weight:600;font-size:15px;margin-top:6px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-head);font-size:20px;font-weight:800;color:var(--teal-deep)}
:root[data-theme="dark"] .brand b{color:var(--teal)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
/* Shield hero */
.hero{position:relative;border-radius:var(--r-lg);padding:20px 18px;background:linear-gradient(160deg,var(--teal-deep),var(--teal));color:#fff;overflow:hidden}
.hero .shieldbox{width:132px;flex:none}
.hero h2{color:#fff;font-size:20px}
.hero .big{font-family:var(--f-head);font-weight:800;font-size:44px;line-height:1}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero .meta span{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:999px;font-size:14px}
@media (prefers-reduced-motion:no-preference){ .wave{transition:transform 1.4s cubic-bezier(.2,.8,.2,1)} }
/* status */
.ind{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.ind:last-child{border-bottom:0}
.ind .v{font-family:var(--f-head);font-weight:700;font-size:18px;direction:ltr;unicode-bidi:isolate}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--mid-soft);color:var(--mid)} .pill.high{background:var(--high-soft);color:var(--high)} .pill.none{background:var(--mint);color:var(--muted)}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:13px;color:var(--muted);font-weight:600;border-radius:12px}
.nav button .i{font-size:22px;line-height:1}
.nav button[aria-current="page"]{color:var(--teal-deep);background:var(--mint)}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--teal)}
/* questionnaire */
.progress{height:8px;border-radius:999px;background:var(--mint);overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);border-radius:999px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;min-height:56px;padding:12px 14px;margin-bottom:10px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);font-size:17px}
.opt .box{width:24px;height:24px;flex:none;border:2px solid var(--muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.opt.radio .box{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--mint)}
.opt[aria-checked="true"] .box{background:var(--teal);border-color:var(--teal)}
.qsection{font-family:var(--f-head);font-weight:700;color:var(--teal-deep);font-size:15px}
:root[data-theme="dark"] .qsection{color:var(--teal)}
.qtext{font-family:var(--f-head);font-size:21px;font-weight:700;margin:10px 0 16px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:50vh}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-start;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.composer{position:sticky;bottom:86px;display:flex;gap:8px;background:var(--paper);padding-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips button{white-space:nowrap}
/* library */
.lcard{border-radius:var(--r-lg);padding:22px 20px;background:var(--card);border:1px solid var(--line);min-height:260px}
.lcard h3{font-size:21px;margin-bottom:10px}
.lcard ul{margin:0;padding-inline-start:20px}
.sect{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:16px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.sect .em{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.badge .e{font-size:30px;display:block}
.badge.off{opacity:.38;filter:grayscale(1)}
.bar{height:12px;border-radius:999px;background:var(--mint);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--teal))}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--card);border-radius:22px;padding:20px;max-width:540px;width:100%;max-height:88vh;overflow:auto}
.alert-red{border-inline-start:6px solid var(--high)} .alert-yellow{border-inline-start:6px solid var(--mid)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;font-size:15px;max-width:92vw}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--mint);font-family:var(--f-head);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.disclaimer{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.water{display:flex;gap:4px;flex-wrap:wrap;direction:rtl}
.water button{width:36px;height:42px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--line);background:var(--card);font-size:18px}
.water button[aria-pressed="true"]{background:#BDE3F3;border-color:#4BA3C7}
.hidden{display:none!important}
.opt.right{border-color:#1B7F63;background:#EAF7F2}
.opt.right .box{background:#1B7F63;border-color:#1B7F63;color:#fff}
.opt.wrong{border-color:#C0413B;background:#FBEDEC}
.opt.wrong .box{background:#C0413B;border-color:#C0413B;color:#fff}
.qblock.qmiss{border-inline-start:3px solid var(--teal)}
</style>
</head>
<body>
<div id="app" class="wrap" aria-live="polite"></div>

<script>

/* ================= Content ================= */

const CONSENT = [
 "هذا البرنامج جزء من دراسة بحثية بكلية التمريض – جامعة بنها، هدفها تقييم أثر برنامج صحي إلكتروني في الوقاية من متلازمة الأيض (التمثيل الغذائي).",

 {id:"D7",sec:"البيانات الشخصية",t:"هل الدخل الشهري كافٍ للأسرة؟",type:"one",o:["كافٍ ويزيد","كافٍ","غير كافٍ"]},
 {id:"D8",sec:"التاريخ المرضي",t:"هل يوجد في الأسرة (الأب، الأم، الإخوة) من هو مصاب بـ: (اختر كل ما ينطبق)",type:"multi",o:["السكري","ارتفاع ضغط الدم","أمراض القلب","السمنة","ارتفاع الدهون"],none:"لا يوجد"},

 {id:"D10",sec:"التاريخ المرضي",t:"التدخين",type:"one",o:["لا أدخن","أدخن سجائر","أدخن شيشة","أدخن سجائر وشيشة","مدخن سابق"]},

const KSEC = "المعلومات عن متلازمة الأيض — كل العبارات في السؤال صحيحة، اختر كل عبارة تعرف إنها صح";
const KNOW = [

 {id:"K5",t:"من عوامل الخطر غير القابلة للتعديل:",o:[["وجود تاريخ عائلي للسكري أو أمراض القلب",1],["التقدّم في العمر",1],["بعض العوامل الوراثية",1],["النوع: الرجال أكتر عرضة في سن مبكرة والسيدات بعد سن اليأس",1]]},
 {id:"K6",t:"في حالة مقاومة الأنسولين بيحصل الآتي:",o:[["خلايا الجسم بتقل استجابتها للأنسولين",1],["البنكرياس بيضطر يفرز كميات أكبر من الأنسولين",1],["مستوى السكر في الدم بيرتفع تدريجياً مع الوقت",1],["مستوى الأنسولين في الدم بيفضل مرتفع لفترات طويلة",1]]},

  ["عوامل الخطر: اللي تقدر تغيّره","دي العوامل اللي في إيدك:\n• السمنة وخاصة تجمّع الدهون حوالين البطن\n• مقاومة الإنسولين\n• قلة النشاط البدني\n• الإفراط في تناول السعرات الحرارية\n• الإفراط في السكريات المكرّرة\n• الإكثار من المشروبات المحلّاة والعصائر المعلّبة\n• زيادة الدهون المشبعة والمتحوّلة في الأكل\n• الاعتماد على الوجبات السريعة والأطعمة المصنّعة\n• التدخين والجلوس الطويل"],
  ["عوامل الخطر: اللي مش في إيدك","في عوامل ما نقدرش نغيّرها، بس معرفتها مهمة عشان تبدأ الفحص الدوري بدري:\n• وجود تاريخ عائلي للسكري أو أمراض القلب\n• التقدّم في العمر\n• بعض العوامل الوراثية\n• النوع: الرجال أكتر عرضة في سن مبكرة، والستات بعد سن اليأس\nوجود العوامل دي مش معناه إنك هتتصاب حتمًا — معناه إن العوامل اللي في إيدك بقت أهم."],
  ["الفحص الدوري لو عندك عوامل خطر","لو عندك أي من عوامل الخطر، المتابعة بتشمل:\n• قياس ضغط الدم بانتظام\n• تحليل السكر الصايم سنويًا\n• متابعة دهون الدم وقياس محيط الخصر\n• استشارة الطبيب عند وجود عوامل خطر\nده بيكشف الحالة وهي لسه في أولها، وساعتها تعديل نمط الحياة لوحده بيكفي غالبًا."]]},
 {id:"walk",em:"👣",title:"المشي صحتك",cards:[
  ["ليه المشي؟","المشي بيحسّن حساسية الجسم للإنسولين، وبينزّل الضغط والسكر، وبيحرق دهون البطن، ومش محتاج أي أدوات."],
  ["قد إيه؟","الهدف 150 دقيقة في الأسبوع مشي سريع، يعني نص ساعة 5 أيام. لو صعب، ابدأ بـ 10 دقايق وزوّد تدريجيًا."],
  ["مشي سريع يعني إيه؟","تقدر تتكلم وانت ماشي، بس مش تقدر تغني. نَفَسك أسرع شوية من العادي."],
  ["أفكار تخليك تتحرك","• انزل محطة قبل بيتك وكمّل مشي.\n• استخدم السلم بدل الأسانسير.\n• اتمشى 10 دقايق بعد الغدا.\n• قوم اتحرك كل ساعة لو قاعد كتير."]]},
 {id:"food",em:"🥗",title:"أكل صحي من مطبخنا",cards:[
  ["السكر المخفي","المشروبات الغازية والعصاير المعلبة فيها سكر كتير جدًا. استبدلها بالمية أو الشاي بسكر قليل، وقلل السكر في الشاي نص معلقة كل أسبوع لحد ما تتعود."],
  ["الملح","الملح الكتير بيرفع الضغط. قلل المخللات والجبن المالح والشيبسي، وبلاش تحط ملح على السفرة، واستخدم الليمون والكمون والتوابل بدل الملح."],
  ["العيش والنشويات","اختار العيش البلدي أو السن بدل الفينو والعيش الأبيض، وقلل كمية الرز والمكرونة، وزوّد الخضار في الطبق."],
  ["الدهون","قلل المقليات والسمنة والدهون الظاهرة في اللحمة. اطبخ بالشوي أو السلق أو الفرن، واستخدم زيت قليل."]]},
 {id:"plate",em:"🍽️",title:"طبقك الصحي بالأكل المصري",cards:[
  ["قاعدة الطبق","• نص الطبق: خضار (سلطة، خضار مطبوخ بزيت قليل).\n• ربع الطبق: بروتين (فول، عدس، فراخ، سمك، بيض، لحمة حمرا قليلة الدهن).\n• ربع الطبق: نشويات (عيش بلدي أو سن، رز، مكرونة، بطاطس)."],
  ["قاعدة الإيد","• البروتين: قد كف إيدك.\n• النشويات: قد قبضة إيدك.\n• الخضار: قد كفين مفتوحين أو أكتر.\n• الدهون (زيت، سمن، زبدة): قد صباعك الإبهام."],
  ["أمثلة من أكلنا","• الفطار: فول بالزيت الحار القليل + بيضة مسلوقة + سلطة + عيش بلدي.\n• الكشري: طبق صغير بدل الكبير، مع زيادة العدس، وتقليل البصل المحمر، وجنبه سلطة.\n• المحشي: 5 إلى 6 صوابع مع طبق سلطة كبير.\n• الملوخية والبامية: طبق كبير مع قطعة فراخ أو لحمة، ورز أو عيش أقل.\n• الحلويات: قطعة صغيرة مرة أو مرتين في الأسبوع."]]},
 {id:"sleep",em:"🌙",title:"النوم الصحي",cards:[
  ["النوم والوزن","النوم أقل من 7 ساعات بيزود الإحساس بالجوع والرغبة في الحلويات، وبيأثر على السكر في الدم. الكبار محتاجين من 7 لـ 9 ساعات نوم كل ليلة."],
  ["مواعيد ثابتة","حاول تنام وتصحى في نفس المواعيد تقريبًا كل يوم، حتى في الإجازة. جسمك بيحب النظام."],
  ["قبل النوم","• اقفل الموبايل والتليفزيون قبل النوم بنص ساعة على الأقل.\n• بلاش شاي أو قهوة أو مشروبات طاقة بعد العصر.\n• بلاش أكل تقيل قبل النوم بساعتين إلى 3 ساعات."],
  ["أوضة النوم","خلّي أوضتك هادية ومضلمة وحرارتها مناسبة. السرير للنوم بس، مش للأكل ولا للشغل."],
  ["النوم والتوتر والوقاية","من إجراءات الوقاية المرتبطة بالنوم والتوتر:\n• النوم من 7 إلى 9 ساعات يوميًا\n• تنظيم مواعيد النوم\n• ممارسة وسائل الاسترخاء وتخفيف التوتر\n• علاج اضطرابات النوم زي انقطاع النفس أثناء النوم\nالتوتر المزمن بيرفع الكورتيزول، والكورتيزول العالي بيزوّد دهون البطن وبيرفع السكر."]]},
 {id:"smoke",em:"🚭",title:"بطّل التدخين والشيشة",cards:[
  ["التدخين ومتلازمة الأيض","التدخين بيزود دهون البطن وبيرفع خطر السكري وأمراض القلب. البطل مش اللي ما شربش أبدًا، البطل اللي قرر يبطّل."],
  ["الشيشة مش أخف","ناس كتير فاكرة إن الشيشة أخف من السجاير لأن الدخان بيعدي على مية. ده مش صحيح. جلسة الشيشة الواحدة ممكن تدخّل في صدرك دخان أكتر بكتير من سيجارة."],
  ["خطوات للبداية","• حدد يوم تبطّل فيه خلال الأسبوعين الجايين.\n• شيل السجاير والولاعات من البيت والعربية.\n• اعرف المواقف اللي بتخليك عايز تدخن، وجهز بديل: مية، مشي 5 دقايق، لبان من غير سكر."],
  ["مش لوحدك","اسأل دكتورك عن عيادات الإقلاع عن التدخين. الرغبة في التدخين بتقل مع الوقت، وكل يوم من غير تدخين مكسب لقلبك."]]},
 {id:"monitor",em:"📏",title:"قيس وتابع بنفسك",cards:[
  ["إزاي تقيس محيط وسطك صح","• اقف مستقيم، ورجليك مفتوحة على قد كتافك، وبطنك مرتاحة.\n• حط الشريط في النص بين آخر ضلع في جنبك وعضمة الحوض (غالبًا فوق السرة بشوية).\n• الشريط مستوي حوالين جسمك ومش ضاغط على الجلد.\n• خد نفس عادي وطلّعه، واقرأ الرقم في آخر الزفير.\n• قيس في نفس الوقت كل مرة (يفضل الصبح قبل الفطار)."],
  ["ليه أسجل كل يوم؟","اللي بيسجل أكله وخطواته ووزنه بيعرف نفسه أكتر، وبيلاحظ التحسن بدري. التسجيل مش لازم يكون كامل، أي حاجة تسجلها النهارده خطوة."],
  ["التحاليل: إزاي تتعمل صح","تحليل السكر الصايم وتحليل الدهون بيتعملوا بعد صيام من 8 لـ 12 ساعة (مية عادي). وضغط الدم بيتقاس بعد راحة 5 دقايق وانت قاعد، ويُفضل تكرار القياس مرتين وتاخد المتوسط. لو الأرقام طلعت غير طبيعية، اعرضها على دكتورك."],
  ["معايير التشخيص بالأرقام","تشخيص المتلازمة الأيضية بيحتاج وجود 3 معايير على الأقل من أصل 5، مع قياس محيط الخصر وعمل تحاليل السكر والدهون وقياس ضغط الدم، واستبعاد الأسباب الأخرى بمعرفة الطبيب. والأرقام:\n• محيط الخصر: 94 سم أو أكتر عند الرجال، و80 سم أو أكتر عند الستات\n• ضغط الدم: 130/85 مليمتر زئبق أو أعلى\n• السكر الصايم: 100 مجم/دسل أو أعلى\n• الدهون الثلاثية: 150 مجم/دسل أو أعلى\n• الكوليسترول النافع: أقل من 40 مجم/دسل عند الرجال، وأقل من 50 مجم/دسل عند الستات\nواللي بياخد علاج لأي معيار من دول بيتحسبله المعيار."],
  ["طريقة قياس محيط الخصر","محيط الخصر بيتقاس عند منتصف المسافة بين أسفل الضلوع وأعلى عظمة الحوض، وبيتقاس بشريط قياس مرن والشخص واقف. خرّج الزفير عادي وما تشدّش بطنك، وخلّي الشريط أفقي ومش ضاغط على الجلد، واقرا الرقم في نهاية الزفير. كرّر القياس مرتين وخد المتوسط."]]},
 {id:"ramadan",em:"🌙",title:"رمضان والمناسبات",seasonal:true,cards:[
  ["الفطار الصحي","افطر على تمرتين أو تلاتة ومية، صلّي، وبعدين كمّل فطارك بطبق صحي: نص خضار، ربع بروتين، ربع نشويات."],
  ["السحور","أخّر السحور، واختار أكل بيشبّع مدة طويلة: فول أو بيض أو زبادي، مع عيش بلدي وخضار. قلل الملح والمخللات عشان ما تعطشش."],
  ["المية","اشرب من 8 إلى 10 أكواب مية ما بين الفطار والسحور، على دفعات مش مرة واحدة."],
  ["الحلويات","الكنافة والقطايف مرة أو مرتين في الأسبوع، بكمية صغيرة، وبعد الفطار بساعتين على الأقل."],
  ["الحركة","امشي نص ساعة بعد الفطار بساعتين، أو بعد التراويح."],
  ["العزومات والأعياد","ابدأ بالسلطة، واختار طبق صغير، واسمح لنفسك بصنف واحد تحبه بكمية معقولة. المهم ترجع لنظامك تاني يوم.\n\nلو عندك مرض مزمن أو بتاخد علاج، استشير دكتورك قبل الصيام."]]},
 {id:"inside",em:"🔬",title:"إيه اللي بيحصل جوه جسمك؟",cards:[
  ["مقاومة الإنسولين","الإنسولين هرمون بيساعد السكر يدخل خلايا جسمك. في مقاومة الإنسولين الخلايا بتقل استجابتها له، فالبنكرياس بيضطر يفرز كميات أكبر عشان يعوّض. ومع الوقت البنكرياس بيتعب، والسكر في الدم يبدأ يرتفع بالتدريج."],
  ["دهون البطن مش دهون عادية","الدهون اللي حوالين الأحشاء نشطة زي الغدة: بتفرز مواد بتسبب التهاب مزمن خفيف، وبتزوّد مقاومة الإنسولين، وبتخلي الكبد ينتج دهون ثلاثية أكتر. عشان كده الكرش أخطر من الدهون في أي مكان تاني."],
  ["ليه الدهون الثلاثية بترتفع؟","زيادة الإنسولين في الدم + إنتاج الكبد للدهون + السكريات الكتير + قلة الحركة. الأربعة بيشتغلوا مع بعض."],
  ["ليه الضغط بيرتفع؟","احتباس الصوديوم والمية، وتضيّق الأوعية الدموية، وزيادة نشاط الجهاز العصبي، وضعف قدرة بطانة الشرايين على الارتخاء."],
  ["علامات على الجلد","اسمرار وخشونة الجلد في الرقبة أو تحت الإبط، وظهور زوايد جلدية صغيرة في ثنيات الجلد — دي علامات مرتبطة بمقاومة الإنسولين، ولو لاحظتها اعمل تحليل سكر واستشير دكتورك."],
  ["التوتر المزمن","التوتر المستمر بيرفع هرمون الكورتيزول، والكورتيزول العالي بيزوّد تخزين الدهون في البطن وبيرفع السكر في الدم. جرّب: مشي 10 دقايق، تنفس عميق 5 مرات ببطء، مكالمة مع حد قريب منك، أو تقسيم شغلك لخطوات صغيرة. ولو التوتر مأثر على نومك أو أكلك بشكل مستمر، اتكلم مع دكتورك."],
  ["الأكل الجاهز والمصنّع","الوجبات السريعة والأطعمة المصنّعة (اللانشون، السجق، الشيبسي، الوجبات المجمدة) فيها سعرات ودهون وملح أعلى بكتير من الأكل البيتي، وبتزوّد الوزن ومقاومة الإنسولين. خلّيها مرة في الأسبوع على الأكتر، وجهّز أكلك في البيت كل ما تقدر."],
  ["الخلاصة","كل المكونات الخمسة مربوطة ببعضها من خلال مقاومة الإنسولين والالتهاب. وعشان كده لما تنزل من وزنك وتتحرك، بتلاقي المؤشرات كلها بتتحسن مع بعض مش واحد بس."],
  ["إزاي تعرف إن في حاجة؟","الصورة الإكلينيكية للمتلازمة الأيضية:\n• غالبًا بتكون بدون أعراض واضحة\n• بتتكشف من خلال الفحص والتحاليل\n• ممكن تفضل سنين من غير ما تتشخّص\n• الأعراض لو ظهرت بتكون غير نوعية: إرهاق بعد الوجبات، خمول، صعوبة في التركيز\nوالعلامات اللي ممكن تلاحظها بنفسك: زيادة محيط الخصر، وتجمّع الدهون في منطقة البطن (شكل الجسم التفاحي)، وزيادة الوزن بشكل عام، وصعوبة إنقاص الوزن رغم المحاولة."],
  ["الأنسولين والسكر مع الوقت","في مقاومة الإنسولين: خلايا الجسم بتقل استجابتها للإنسولين، فالبنكرياس بيفرز كميات أكبر، ومستوى الإنسولين في الدم بيفضل مرتفع لفترات طويلة. ومع الوقت البنكرياس بيتعب، ومستوى السكر في الدم بيرتفع تدريجيًا. الدهون الحشوية نفسها نشطة هرمونيًا، بتفرز مواد التهابية، وبتزوّد مقاومة الإنسولين، وبتزوّد إنتاج الكبد للدهون الثلاثية."]]},
 {id:"comps",em:"⚠️",title:"لو أهملتها بيحصل إيه؟",cards:[
  ["السكري","أول وأشهر مضاعفة: مقدمات السكري، وبعدين السكري من النوع الثاني. والستات اللي عندهن المتلازمة معرضات أكتر لسكري الحمل."],
  ["القلب والشرايين","تصلب الشرايين، الذبحة الصدرية، الجلطة القلبية، والجلطة الدماغية، وارتفاع الضغط المزمن."],
  ["الكبد","الكبد الدهني غير الكحولي، وممكن يتطور لالتهاب وتليّف في الحالات المتقدمة. غالبًا أول علامة بتكون ارتفاع إنزيمات الكبد في التحاليل من غير أي أعراض."],
  ["الكلى","ظهور الزلال في البول، وبعدها ضعف تدريجي في وظائف الكلى. تحليل الزلال في البول تحليل بسيط ورخيص وبيكشف بدري."],
  ["مضاعفات تانية","انقطاع النفس أثناء النوم، تكيس المبايض عند الستات، النقرس، وزيادة خطر بعض أنواع السرطان."],
  ["الخبر المطمئن","المضاعفات دي بتتطور ببطء على سنين — وده معناه إن عندك وقت. كل تحسن في وزنك ونشاطك وتحاليلك بيقلل الخطر ده فعلًا."],
  ["الكلى والكبد بالاسم","من المضاعفات الكلوية للمتلازمة: ظهور الزلال في البول، واعتلال الكلى المزمن، وتدهور وظائف الكلى تدريجيًا، وزيادة خطر الفشل الكلوي على المدى البعيد. ومن المضاعفات الكبدية: الكبد الدهني غير الكحولي، والتهاب الكبد الدهني، والتليّف الكبدي في الحالات المتقدمة، وارتفاع إنزيمات الكبد في التحاليل."],
  ["مضاعفات أيضية وقلبية بالتفصيل","المضاعفات الأيضية: مقدمات السكري، والسكري من النوع التاني، وارتفاع السكر المزمن في الدم، وزيادة خطر الإصابة بسكري الحمل عند السيدات.\nوالمضاعفات القلبية الوعائية: تصلب الشرايين، والذبحة الصدرية والجلطة القلبية، والجلطة الدماغية، وارتفاع ضغط الدم المزمن."]]},
 {id:"plan",em:"📋",title:"الخطة العلاجية",cards:[
  ["حجر الأساس","أربع حاجات: أكل صحي، نشاط بدني منتظم، إنقاص الوزن، والإقلاع عن التدخين. دول العلاج الأساسي، مش مجرد نصايح."],
  ["الرقم اللي يفرق","مش مطلوب وزن مثالي. نزول من 5 إلى 10% من وزنك الحالي بيقلل مقاومة الإنسولين وبيخفض الضغط والدهون الثلاثية والسكر الصايم. يعني لو وزنك 90 كيلو، نزول من 5 لـ 9 كيلو كفاية عشان تحاليلك تتحسن."],
  ["وصفة النشاط البدني","150 دقيقة في الأسبوع نشاط متوسط الشدة، مع تمارين مقاومة مرتين على الأقل، وتقليل فترات الجلوس الطويلة، والتدرج في الزيادة."],
  ["الأكل","قلل السكريات المكررة والمشروبات المحلاة، وخلي الملح أقل من 5 جرام في اليوم (حوالي معلقة صغيرة)، وزوّد الخضار والفاكهة والحبوب الكاملة والألياف."],
  ["والأدوية؟","الأدوية بتيجي لما تعديل نمط الحياة لوحده ما يكفيش، والطبيب هو اللي بيحدد نوعها وجرعتها. مهم جدًا: الدواء بيتاخد **مع** استمرار تعديل نمط الحياة مش بديل عنه، وما تبطلش العلاج من نفسك لما تحس إنك بقيت أحسن."],

  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(bytes[o+4*i]<<24)|(bytes[o+4*i+1]<<16)|(bytes[o+4*i+2]<<8)|bytes[o+4*i+3];
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0; h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0; }
    H=H.map((x,i)=>(x+[a,b,c,d,e,f,g,h][i])|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function hashStr(s){ let h=7; for(const c of s) h=(h*33+c.charCodeAt(0))>>>0; return h; }

  _saveLocal(m){ try{ localStorage.setItem("ms_demo_db", JSON.stringify(m)); }catch(e){ this._mem=m; } },
  _newer(a,b){ if(!a) return b; if(!b) return a; return (a.updatedAt||"")>=(b.updatedAt||"")?a:b; },
  async get(code){ return clone(await this._get(code)); },

/* ================= Scoring ================= */
function scoreK(id, sel){
  const it = KNOW.find(k=>k.id===id); if(!sel || sel.dk || !sel.v || !sel.v.length) return 0;
  const correct = it.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
  const hitC = sel.v.filter(i=>it.o[i] && it.o[i][1]).length;
  const hitW = sel.v.filter(i=>it.o[i] && !it.o[i][1]).length;
  if(hitC===0) return 0;
  if(hitC===correct.length && hitW===0) return 2;
  return 1;
}
/* the eight content areas of the knowledge tool, for the domain sub-scores */
const KDOM = [
 ["definition",["K1", "K2"]],
 ["causes",["K3", "K4", "K5"]],
 ["pathophysiology",["K6", "K7"]],
 ["manifestations",["K8", "K9"]],
 ["diagnosis",["K10", "K11", "K12"]],
 ["complications",["K13", "K14", "K15"]],
 ["treatment",["K16", "K17", "K18"]],
 ["prevention",["K19", "K20"]]
];
function computeScores(ans, group, tp){
  const r = {};
  let k=0; KNOW.forEach(it=>{ const s=scoreK(it.id, ans[it.id]); r[it.id+"_score"]=s; k+=s; });
  r.knowledge_total=k; r.knowledge_level = k>=30?"Good":k>=24?"Average":"Poor";   /* of 40 */
  KDOM.forEach(([key,ids])=>{ r["k_"+key] = ids.reduce((a,id)=>a+(r[id+"_score"]||0),0); });
  /* practice: always 2 · sometimes 1 · never 0, total 0–50 */
  let d=0,pa=0,sl=0; PRACT.forEach(([id],i)=>{ const v= ans[id]==null?0:(2-ans[id]); if(i<10) d+=v; else if(i<18) pa+=v; else sl+=v; });
  r.practice_diet=d; r.practice_activity=pa; r.practice_sleep_tobacco=sl; r.practice_total=d+pa+sl;
  r.practice_level=(d+pa+sl)>=30?"Satisfactory":"Unsatisfactory";
  /* Tool II: four social-cognitive constructs, total 0–46 */
  let se=0; SE.forEach(([id])=>{ se += ans[id]==null?0:(2-ans[id]); });
  r.sct_total=se; r.sct_level = se>=35?"High":se>=28?"Moderate":"Low";
  const lvl3=(v,max)=> v/max>=.75?"High": v/max>=.6?"Moderate":"Low";
  SCT_SUBS.forEach(([key,pre,n])=>{
    const v = SE.filter(([id])=>id.startsWith(pre)).reduce((a,[id])=> a + (ans[id]==null?0:(2-ans[id])), 0);
    r[key]=v; r[key+"_level"]=lvl3(v, n*2);
  });
  r.selfefficacy_total=r.sct_selfefficacy; r.selfefficacy_level=r.sct_selfefficacy_level;
  if(tp==="post" && group==="study"){
    const sub=[0,0,0]; ENG.forEach(([id],i)=>{ const v= ans[id]==null?0:(2-ans[id]); sub[i<6?0:i<12?1:2]+=v; });
    const lv=(v,max)=> v/max>=.75?"High": v/max>=.6?"Moderate":"Low";
    r.eng_goal_selfreg=sub[0]; r.eng_goal_selfreg_level=lv(sub[0],12);
    r.eng_learning=sub[1]; r.eng_learning_level=lv(sub[1],12);
    r.eng_acceptability=sub[2]; r.eng_acceptability_level=lv(sub[2],16);
    const t=sub[0]+sub[1]+sub[2]; r.eng_total=t; r.eng_level= t>=30?"High":t>=24?"Moderate":"Low";
  }
  return r;
}

function buildItems(tp, group){

function chart(p, field){
  const arr=logsArr(p).filter(([d,e])=>e[field]!=null).slice(-30);
  if(arr.length<2) return `<p class="muted small">سجّل يومين على الأقل علشان يظهر الرسم.</p>`;
  const vals=arr.map(x=>+x[1][field]); const refs={waist: sexOf(p)==="female"?80:94, steps:7000, sbp:130, glu:100, water:8};
  let mn=Math.min(...vals), mx=Math.max(...vals); if(refs[field]!=null){ mn=Math.min(mn,refs[field]); mx=Math.max(mx,refs[field]); }
  if(mx===mn){ mx+=1; mn-=1; } const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  const W=320,H=150; const X=i=>W-10-(i/(vals.length-1))*(W-20); const Y=v=>H-10-((v-mn)/(mx-mn))*(H-20);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const ref = refs[field]!=null? `<line x1="10" x2="${W-10}" y1="${Y(refs[field])}" y2="${Y(refs[field])}" stroke="var(--saffron)" stroke-dasharray="5 5" stroke-width="2"/><text x="${W-12}" y="${Y(refs[field])-5}" font-size="11" fill="var(--muted)" text-anchor="start">الحد ${refs[field]}</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="رسم بياني لآخر ${vals.length} قراءة">${ref}<polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--teal)"/>`).join("")}</svg>
   <p class="small muted" style="margin:4px 0 0">أول قراءة: ${vals[0]} — آخر قراءة: ${vals[vals.length-1]}</p>`;
}
function historyTable(p){

function saveLog(){
  const p=S.p; p.logs=p.logs||{}; const k=dkey(); const old=p.logs[k]||{};
  const rng=(v,a,b)=> v==null?null:(v<a||v>b?"bad":v);
  const vals={ weight:rng(num($("#lWeight").value),30,250), waist:rng(num($("#lWaist").value),50,200), steps:rng(num($("#lSteps").value),0,60000), meals:rng(num($("#lMeals").value),0,10),
    sbp:rng(num($("#lSbp").value),70,250), dbp:rng(num($("#lDbp").value),40,150), glu:rng(num($("#lGlu").value),40,600) };
  if(Object.values(vals).includes("bad")) return toast("في رقم غريب شوية. راجع الأرقام وحاول تاني.");
  if((vals.sbp==null)!==(vals.dbp==null)) return toast("سجّل الرقمين بتوع الضغط مع بعض");
  const e={...old, ...Object.fromEntries(Object.entries(vals).filter(([,v])=>v!=null))};
  e.water = old.water ?? 0; if(S.waterTmp!=null) e.water=S.waterTmp;
  if(vals.glu!=null) e.gluType = S.gluType||old.gluType||"fasting";
  const fields=["weight","waist","steps","meals","sbp","glu","water"];
  const newly = fields.filter(f=>e[f]!=null && (f!=="water"||e.water>0) && (old[f]==null || (f==="water"&&!(old.water>0)))).length;
  if(newly) addPoints(p, 5*newly, "log");
  p.logs[k]=e; S.waterTmp=null; p.lastActive=nowISO();
  const st=streak(p); if(st>0 && st%7===0 && !(p.streakAwards||[]).includes(k)){ addPoints(p, st%30===0?200:50, "streak"); (p.streakAwards=p.streakAwards||[]).push(k); }
  p.maxStreak=Math.max(p.maxStreak||0,st);
  const al = checkAlerts(p, e, vals);
  Store.put(p).catch(()=>{});
  if(al) showAlert(al); else toast("برافو! سجلت بياناتك النهارده ✅");

function checkAlerts(p, e, vals){
  let res=null; const add=(type,reason,msg)=>{ (p.alerts=p.alerts||[]).push({type,reason,at:nowISO(),reviewed:false}); if(!res || type==="red") res={type,msg}; };
  if(vals.sbp!=null && (vals.sbp>=180||vals.dbp>=110)) add("red","BP "+vals.sbp+"/"+vals.dbp,"قراءة الضغط دي عالية جدًا ⚠️ اقعد واسترخى 5 دقايق وقيس تاني. لو القراءة لسه عالية، لازم تكلم دكتور النهارده. ولو معاها ألم في الصدر أو صداع شديد أو زغللة أو ضعف في جزء من الجسم، اتصل بالإسعاف فورًا على 123.");
  if(vals.glu!=null && vals.glu>=300) add("red","Glucose "+vals.glu,"قراءة السكر دي عالية جدًا ⚠️ لازم تتواصل مع دكتور النهارده. ولو معاها قيء أو دوخة شديدة أو تعب غير عادي، روح الطوارئ فورًا.");
  if(vals.glu!=null && vals.glu<70) add("red","Glucose "+vals.glu,"قراءة السكر دي أقل من الطبيعي ⚠️ خد حاجة مسكّرة بسرعة، زي نص كوباية عصير أو 3 معالق سكر في مية، وقيس تاني بعد ربع ساعة. لو لسه واطي أو حاسس بدوخة أو عرق أو رعشة، اطلب مساعدة طبية فورًا.");
  if(!res){
    const yellowMsg="القراءة دي أعلى من الطبيعي. محتاجين نتأكد منها مع الدكتور، ياريت تحجز كشف في أقرب وقت وتاخد معاك سجل قراءاتك من التطبيق.";
    if(vals.glu!=null && ((e.gluType==="random"&&vals.glu>=200)||(e.gluType!=="random"&&vals.glu>=126))) add("yellow","Glucose "+vals.glu+" "+e.gluType,yellowMsg);
    if(vals.sbp!=null && (vals.sbp>=140||vals.dbp>=90)){
      const prev=Object.entries(p.logs||{}).filter(([d,x])=>d!==dkey() && d>=daysAgo(7) && (x.sbp>=140||x.dbp>=90));
      if(prev.length) add("yellow","BP "+vals.sbp+"/"+vals.dbp+" twice/7d",yellowMsg);
    }
  }
  return res;
}

    <div class="row"><input id="chatIn" class="input" placeholder="اكتب سؤالك…" ${avail?"":"disabled"}><button class="btn" data-act="send" ${avail&&!S.chatBusy?"":"disabled"} aria-label="إرسال">إرسال</button></div>
  </div>

async function sendChat(text){
  const p=S.p; text=(text||"").trim(); if(!text || S.chatBusy) return;
  const today=dkey(); const todayCount=(p.chat||[]).filter(m=>m.role==="user" && (m.at||"").startsWith(today)).length;
  if(todayCount>=40) return toast("وصلت للحد اليومي للأسئلة. نكمل بكرة إن شاء الله.");
  p.chat=p.chat||[]; p.chat.push({role:"user",content:text,at:nowISO()}); S.chatBusy=true; render();
  const ctx = { sex:sexOf(p), age:p.age??null, goal:p.goal?.text??null, level:level(points(p)).cur[1],
    last7days: [...Array(7)].map((_,i)=>({date:daysAgo(i), ...(p.logs||{})[daysAgo(i)]})).filter(x=>Object.keys(x).length>1) };
  const history = p.chat.slice(-20).map(m=>({role:m.role, content:m.content}));
  while(history.length && history[0].role!=="user") history.shift();
  const input=[{role:"user", content: ASSIST_RULES + "\n\nParticipant context (JSON, no identifiers): " + JSON.stringify(ctx).slice(0,3000) + "\n\nThe conversation follows."}, ...history];
  const bub=$("#streamBub"); if(bub){ bub.classList.remove("hidden"); bub.textContent="…"; }
  if(!Cap.sample && !CONFIG.AI_ENDPOINT){
    await new Promise(r=>setTimeout(r,500));
    p.chat.push({role:"assistant",content:faqAnswer(text),at:nowISO()});
  } else if(!Cap.sample){
    try{
      const res=await withTimeout(fetch(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:ASSIST_RULES, context:ctx, messages:history})}),30000);
      const j=await res.json(); p.chat.push({role:"assistant",content:(j.text||faqAnswer(text)),at:nowISO()});
    }catch(e){ p.chat.push({role:"assistant",content:faqAnswer(text),at:nowISO()}); }
  } else
  try{
    const r = await Cap.sample(input, {cache:false, onText:({text})=>{ const b=$("#streamBub"); if(b){ b.textContent=text; b.scrollIntoView({block:"end"}); } }});
    p.chat.push({role:"assistant",content:r.text,at:nowISO()});
  }catch(e){
    if(e && e.text) p.chat.push({role:"assistant",content:e.text,at:nowISO()});
    toast(e&&e.code==="rate_limited"?"المساعد مشغول دلوقتي، حاول بعد شوية":"المساعد مردش. حاول مرة تانية.");
  }
  if(p.chat.length>60) p.chat=p.chat.slice(-60);
  logEvent(p,"chat"); S.chatBusy=false; Store.put(p).catch(()=>{}); render();
  const cb=$("#chatBox"); if(cb) cb.lastElementChild?.scrollIntoView({block:"end"});
}

function ytId(u){ const m=String(u||"").match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
function secVideos(id){ return ((CONFIG.VIDEOS||{})[id]||[]).filter(v=>v && v.url); }
function videoBlock(sec){
  const vids=secVideos(sec.id); if(!vids.length) return "";

      ${seen?`<p style="color:var(--ok);font-weight:700;margin:8px 0 0">✓ شاهدته</p>`:`<button class="btn soft block" style="margin-top:8px" data-act="vidSeen" data-k="${key}">شاهدته ✓ (+10)</button>`}</div>`; }).join("");

function ramadanOn(){ const t=dkey(); return !!S.settings.ramadan || (t>=CONFIG.RAMADAN_START && t<=CONFIG.RAMADAN_END); }
function libSections(){ return LIB.filter(s=>!s.seasonal || ramadanOn()); }
function recommended(p){
  const rec=[]; const st=weeklyAvg(p,"steps"); const g=lastVal(p,"glu");
  if(st!=null && st<4000) rec.push("walk");
  if(g && g.v>=100) rec.push("food");
  if(!activeDays(p).has(dkey()) && !activeDays(p).has(daysAgo(1))) rec.push("monitor");
  if(ramadanOn()) rec.unshift("ramadan");
  if(!rec.length) rec.push("plate","sleep");
  return [...new Set(rec)].slice(0,3).map(id=>LIB.find(s=>s.id===id)).filter(Boolean);
}

function pctOf(a,b){ return b? Math.round(a/b*100):0; }
function lvlChip(txt){
  const m={High:"مرتفعة",Moderate:"متوسطة",Low:"منخفضة",Good:"جيدة",Average:"متوسطة",Poor:"ضعيفة",
           Satisfactory:"مُرضية",Unsatisfactory:"غير مُرضية"};
  const cls = /High|Good|Satisfactory/.test(txt)?"ok":/Moderate|Average/.test(txt)?"mid":"high";
  return `<span class="pill ${cls}">${m[txt]||txt}</span>`;
}

let arVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); arVoice = vs.find(v=>/ar[-_]EG/i.test(v.lang)) || vs.find(v=>/^ar/i.test(v.lang)) || null; }catch(e){ arVoice=null; } }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=()=>{ const had=!!arVoice; pickVoice(); if(!had && arVoice) render(); }; }
function ttsBtn(text){ if(!arVoice) return ""; return `<button class="iconbtn" data-act="tts" data-t="${esc(text)}" aria-label="استمع">🔊</button>`; }
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.voice=arVoice; u.lang=arVoice.lang; u.rate=.95; speechSynthesis.speak(u); if(S.p){ logEvent(S.p,"tts"); } }catch(e){} }

/* ---- File download (works on a normal website) ---- */
function saveFile(filename, data, mime){
  try{ const blob=new Blob([data],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch(e){ return false; }
}

async function sendMyData(){
  const p=S.p; const payload=JSON.stringify({app:"metabolic-shield", version:1, exportedAt:nowISO(), participant:p});
  const name=`${p.code}_${dkey()}.json`;
  try{
    const file=new File([payload], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"بيانات "+p.code}); logEvent(p,"data_sent"); Store.put(p); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(saveFile(name, payload, "application/json")){ toast("اتحفظ الملف. ابعته للباحث."); logEvent(p,"data_sent"); Store.put(p); }
}

/* ---- Researcher: analysis tables ---- */
function meanPct(list, tp, key, max){
  const v=list.map(p=> p[tp] ? pctOf(p[tp].scores[key]||0, max) : null).filter(x=>x!=null);
  return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null;
}
function cmpRows(rows){
  const I=S.rData.filter(p=>p.group==="study"), C=S.rData.filter(p=>p.group==="control");
  const cell=v=> v==null?"—":v+"%";
  const dch=(a,b)=> (a==null||b==null)?"—":(b-a>0?`<span class="pill ok">+${b-a}</span>`:b-a===0?"0":`<span class="pill high">${b-a}</span>`);
  return `<div class="tbl"><table><thead><tr><th>${rows.label}</th>
    <th>تجريبية قبل</th><th>تجريبية بعد</th><th>الفرق</th>
    <th>ضابطة قبل</th><th>ضابطة بعد</th><th>الفرق</th></tr></thead><tbody>
    ${rows.items.map(([name,key,max])=>{
      const ip=meanPct(I,"pre",key,max), iq=meanPct(I,"post",key,max);
      const cp=meanPct(C,"pre",key,max), cq=meanPct(C,"post",key,max);
      return `<tr><td>${name}</td><td>${cell(ip)}</td><td>${cell(iq)}</td><td>${dch(ip,iq)}</td>
        <td>${cell(cp)}</td><td>${cell(cq)}</td><td>${dch(cp,cq)}</td></tr>`;
    }).join("")}
  </tbody></table></div>`;
}

async function saveClinical(){
  const p=S.rData.find(x=>x.code===S.rSel); const tp=S.rTp||"pre";
  const g=id=>num($("#"+id).value);
  let c={cWeight:g("cWeight"),cHeight:g("cHeight"),cWaist:g("cWaist"),cGlu:g("cGlu"),cS1:g("cS1"),cD1:g("cD1"),cS2:g("cS2"),cD2:g("cD2"),cTg:g("cTg"),cHdl:g("cHdl")};
  if(c.cHeight==null && tp==="post" && p.clinical?.pre?.cHeight) c.cHeight=p.clinical.pre.cHeight;
  const miss=Object.entries(c).filter(([,v])=>v==null).map(([k])=>k);
  if(miss.length) return toast("كمّل كل الخانات قبل الحفظ");
  const sbp=(c.cS1+c.cS2)/2, dbp=(c.cD1+c.cD2)/2; const fem=p.sex==="female";
  const comp={ waist: c.cWaist>=(fem?80:94), tg:c.cTg>=150, hdl:c.cHdl<(fem?50:40), bp: sbp>=130||dbp>=85, glu:c.cGlu>=100 };
  const others=["tg","hdl","bp","glu"].filter(k=>comp[k]).length;
  c.bmi=+(c.cWeight/((c.cHeight/100)**2)).toFixed(1); c.sbpMean=+sbp.toFixed(1); c.dbpMean=+dbp.toFixed(1);
  c.idf={...comp, count:Object.values(comp).filter(Boolean).length, mets: comp.waist && others>=2}; c.date=dkey();
  p.clinical=p.clinical||{}; p.clinical[tp]=c;
  if(sbp>=180||dbp>=110||c.cGlu>=250||c.cGlu<70){ (p.alerts=p.alerts||[]).push({type:"red",reason:"Clinic: BP "+c.sbpMean+"/"+c.dbpMean+", FPG "+c.cGlu+" — يحتاج تحويل للطبيب",at:nowISO(),reviewed:false}); toast("⚠️ قراءة خطرة: يحتاج تحويل للطبيب"); }
  await Store.put(p).catch(()=>{}); render(); toast("تم الحفظ");
}
async function createCodes(){
  const g=$("#rg").value, sex=$("#rs").value, n=Math.max(1,Math.min(100,+$("#rn").value||1));
  const used=new Set(S.rData.filter(p=>p.code.startsWith("MS-"+g)).map(p=>+p.code.slice(5)));
  let k=1; const made=[];
  while(made.length<n){ if(!used.has(k)){ const code=`MS-${g}-${String(k).padStart(3,"0")}`; const p={code, group:g==="S"?"study":"control", sex, createdAt:nowISO(), active:true}; made.push(p); used.add(k); } k++; if(k>999) break; }
  for(const p of made) await Store.put(p).catch(()=>{});
  await loadR(); render(); toast(`تم إنشاء ${made.length} كود`);
}
async function rUpdate(code, fn){ const p=S.rData.find(x=>x.code===code); if(!p) return; fn(p); await Store.put(p); await loadR(); render(); }

async function importFiles(files){
  let ok=0, bad=0;
  for(const f of files){
    try{
      const j=JSON.parse(await f.text()); const inc=j && j.participant; if(!inc || !/^MS-[SC]-\d{3}$/.test(inc.code||"")) throw 0;
      const cur=S.rData.find(x=>x.code===inc.code);
      const merged={...inc};
      if(cur){
        merged.clinical={...(inc.clinical||{}), ...(cur.clinical||{})};
        if(cur.sex) merged.sex=cur.sex;
        if(cur.postUnlocked && !merged.postUnlocked) merged.postUnlocked=cur.postUnlocked;
        if(cur.fullAccess) merged.fullAccess=true;
        const rev=new Set((cur.alerts||[]).filter(a=>a.reviewed).map(a=>a.at));
        merged.alerts=(inc.alerts||[]).map(a=>rev.has(a.at)?{...a,reviewed:true}:a);
      }
      await Store.put(merged); ok++;
    }catch(e){ bad++; }
  }
  await loadR(); render(); toast(`تم استيراد ${ok} ملف${bad?` — ${bad} ملف غير صالح`:""}`);
}
function csvExport(){
  const cols=new Set(["code","group","sex","timepoint","consent_at","started_at","submitted_at","duration_min"]);
  const rows=[];
  const eng=p=>({ days_logged:Object.keys(p.logs||{}).length, longest_streak:p.maxStreak||0, points:points(p), level:level(points(p)).cur[1],
    badges:BADGES.filter(b=>b[3](p)).map(b=>b[0]).join("|"), challenges_done:Object.keys(p.challenge||{}).length, chat_user_msgs:(p.chat||[]).filter(m=>m.role==="user").length,
    library_read:(p.read||[]).length, videos_watched:(p.videos||[]).length, goal:p.goal?.text||"", goal_days_achieved:(p.goalTicks||[]).length, goals_completed:p.goalsDone||0,
    alerts_red:(p.alerts||[]).filter(a=>a.type==="red").length, alerts_yellow:(p.alerts||[]).filter(a=>a.type==="yellow").length,
    logins:(p.events||{}).login||0, tts_uses:(p.events||{}).tts||0 });
  S.rData.forEach(p=>["pre","post"].forEach(tp=>{
    const q=p[tp]; const c=(p.clinical||{})[tp];
    if(!q && !c) return;
    const r={code:p.code, group:p.group, sex:p.sex, timepoint:tp, consent_at:p.consentAt||"", started_at:q?.startedAt||"", submitted_at:q?.submittedAt||"", duration_min:q?.durationMin??""};
    if(q){ Object.entries(q.answers).forEach(([k,v])=>{ let val=v; if(v&&typeof v==="object"){ val = v.dk?"DK": v.none?"none": (v.v!=null&&!Array.isArray(v.v)? (v.v+1)+(v.txt?":"+v.txt:"") : (v.v||[]).map(i=>i+1).join("|")); } else if(typeof v==="number" && k.match(/^(P|SE|OE|SR|SS|E)\d/)) { val = 2-v; } else if(typeof v==="number" && k.startsWith("D") && k!=="D1") val=v+1; r[k]=val; }); Object.assign(r,q.scores); }
    if(c){ ["cWeight","cHeight","cWaist","cS1","cD1","cS2","cD2","cGlu","cTg","cHdl","bmi","sbpMean","dbpMean"].forEach(k=>r["t4_"+k]=c[k]); ["waist","tg","hdl","bp","glu"].forEach(k=>r["idf_"+k]=c.idf[k]?1:0); r.idf_count=c.idf.count; r.mets=c.idf.mets?1:0; }
    if(tp==="post" && p.group==="study") Object.assign(r, eng(p));
    Object.keys(r).forEach(k=>cols.add(k)); rows.push(r);
  }));
  const C=[...cols]; const cell=v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return "\uFEFF"+C.join(",")+"\n"+rows.map(r=>C.map(k=>cell(r[k])).join(",")).join("\n");
}
async function doExport(){
  const csv=csvExport();
  if(Cap.downloads){ try{ await Cap.downloads.save({filename:`metabolic_shield_export_${dkey()}.csv`, data:csv}); return; }catch(e){ if(e.code==="declined") return; } }
  if(saveFile(`metabolic_shield_export_${dkey()}.csv`, csv, "text/csv;charset=utf-8")) return;
  const t=$("#csvOut"); t.classList.remove("hidden"); t.value=csv; t.select(); toast("انسخ النص ده والصقه في ملف CSV");
}

/* ================= Events ================= */
function bind(){
  app.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click", ev=>act(el,ev)));
  ["iCode"].forEach(id=>{ const el=$("#"+id); if(el) el.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); doLogin(); } }; });
  ["p1","p2"].forEach(id=>{ const el=$("#"+id); if(el) el.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); savePin(); } }; });
  const qn=$("#qNum"); if(qn) qn.oninput=()=>{ S.q.d.answers[S.q.items[S.q.d.idx].id]=qn.value.replace(/[^\d]/g,""); const b=app.querySelector('[data-act="qNext"]'); b.disabled=!isAnswered(S.q.items[S.q.d.idx], S.q.d.answers[S.q.items[S.q.d.idx].id]); };
  const qt=$("#qTxt"); if(qt) qt.oninput=()=>{ S.q.d.answers[S.q.items[S.q.d.idx].id].txt=qt.value; };
  app.querySelectorAll("input.qnum").forEach(el=> el.oninput=()=>{
    S.q.d.answers[el.dataset.id]=el.value.replace(/[^\d]/g,""); });
  app.querySelectorAll("input.qtxt").forEach(el=> el.oninput=()=>{
    const cur=S.q.d.answers[el.dataset.id]; if(cur) cur.txt=el.value; });
  const imf=$("#importFiles"); if(imf) imf.onchange=()=>importFiles(imf.files);
  const ci=$("#chatIn"); if(ci) ci.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); sendChat(ci.value); } };
}
async function act(el, ev){
  try{ await act2(el, ev); }catch(e){ console.error(e); showFatal((e&&(e.code||e.message))||String(e)); }
}
async function act2(el, ev){
  const a=el.dataset.act, k=el.dataset.k; const p=S.p;
  switch(a){
    case "login": doLogin(); break;
    case "sendData": sendMyData(); break;
    case "vidSeen": p.videos=p.videos||[]; if(!p.videos.includes(k)){ p.videos.push(k); addPoints(p,10,"video"); Store.put(p); toast("+10 نقاط 🎬"); } render(); break;
    case "unlockPost": { const v=($("#unlockCode").value||"").trim().toUpperCase(); if(v===CONFIG.POST_UNLOCK_CODE.toUpperCase()){ p.postUnlocked=nowISO(); Store.put(p); toast("تم فتح الاستبيان النهائي"); S.tab="home"; render(); } else toast("الرمز غير صحيح"); break; }
    case "rImport": $("#importFiles").click(); break;
    case "savePin": savePin(); break;
    case "toggleCons": S.cons=!S.cons; render(); break;
    case "consent": p.consentAt=nowISO(); Store.put(p).catch(()=>{}); startQ("pre"); break;
    case "pick": { const it=qItem(el); S.q.d.answers[it.id] = it.type==="oneText"? {v:+k, txt:(S.q.d.answers[it.id]||{}).txt||""} : +k; qKeep(el); break; }
    case "tick": { const it=qItem(el); const cur=S.q.d.answers[it.id]||{v:[]}; const v=new Set(cur.v||[]); v.has(+k)?v.delete(+k):v.add(+k); S.q.d.answers[it.id]={v:[...v].sort((x,y)=>x-y)}; qKeep(el); break; }
    case "tickNone": { const it=qItem(el); const cur=S.q.d.answers[it.id]; const on=!(cur&&(cur.dk||cur.none)); S.q.d.answers[it.id]= on ? (it.type==="know"?{v:[],dk:true}:{v:[],none:true}) : {v:[]}; qKeep(el); break; }
    case "qMode": { S.qMode = S.qMode==="one" ? "all" : "one"; render(); break; }
    case "qSend": {
      const miss=S.q.items.find(x=>!isAnswered(x,S.q.d.answers[x.id]));
      if(miss){ const n=S.q.items.filter(x=>!isAnswered(x,S.q.d.answers[x.id])).length;
        if(!confirm("فاضل "+n+" سؤال من غير إجابة. تحب تبعت كده؟")){
          const el=document.getElementById("q_"+miss.id); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); break; } }
      return qSubmit();
    }
    case "qPrev": S.q.d.idx=Math.max(0,S.q.d.idx-1); Store.put(p).catch(()=>{}); render(); break;
    case "qNext": { if(S.q.d.idx===S.q.items.length-1) return qSubmit(); S.q.d.idx++; Store.put(p).catch(()=>{}); render(); break; }
    case "lcheck": { const [sid,qi,oi]=k.split(":"); p.checks=p.checks||{}; p.checks[sid]=p.checks[sid]||{};
      p.checks[sid][qi]=+oi; Store.put(p).catch(()=>{}); render(); break; }
    case "afterDone": route(); break;
    case "startPost": startQ("post"); break;
    case "cert": layer(`<div class="sheet"><h2>شهادتك</h2><p class="small muted">اكتب اسمك كما تحب يظهر على الشهادة. الاسم مش هيتحفظ في التطبيق.</p><input id="certName" class="input" placeholder="الاسم (اختياري)"><button class="btn block" style="margin-top:12px" data-act="certGo">تحميل الشهادة</button></div>`); break;
    case "rpwGo": { const v=($("#rpw").value||""); if(v.length<4) return toast("كلمة السر 4 حروف على الأقل"); let saved=null; try{ saved=localStorage.getItem("ms_rpw"); }catch(e){} const h=sha("rpw:"+v); if(!saved){ try{ localStorage.setItem("ms_rpw",h); }catch(e){} } else if(saved!==h){ return toast("كلمة السر غير صحيحة"); } S.rAuthed=true; $("#layer").innerHTML=""; openResearcher(); break; }
    case "certGo": S.certName=($("#certName")||{}).value||""; $("#layer").innerHTML=""; certificate(); break;
    case "logout": session(null); S.p=null; S.screen="login"; S.tab="home"; render(); break;
    case "chDone": p.challenge=p.challenge||{}; p.challenge[dkey()]=challengeToday(p); addPoints(p,20,"challenge"); p.lastActive=nowISO(); Store.put(p).catch(()=>{}); toast("برافو! +20 نقطة 🎉"); render(); break;
    case "goalPick": p.goal={text:GOALS[+k], start:dkey()}; Store.put(p).catch(()=>{}); render(); break;
    case "goalCustom": { const v=$("#goalCustom").value.trim(); if(v.length<4) return toast("اكتب هدف واضح"); p.goal={text:v,start:dkey()}; Store.put(p).catch(()=>{}); render(); break; }
    case "goalTick": p.goalTicks=p.goalTicks||[]; p.goalTicks.push(dkey()); addPoints(p,15,"goal"); Store.put(p).catch(()=>{}); toast("عاش! +15 نقطة"); render(); break;
    case "goalNew": { const done=(p.goalTicks||[]).filter(d=>d>=p.goal.start).length; if(done>=20) p.goalsDone=(p.goalsDone||0)+1; (p.goalHistory=p.goalHistory||[]).push({...p.goal, daysAchieved:done}); p.goal=null; Store.put(p).catch(()=>{}); render(); break; }
    case "goLog": S.tab="log"; render(); break;
    case "water": { const cur=S.waterTmp ?? ((p.logs||{})[dkey()]||{}).water ?? 0; S.waterTmp = (+k===cur)? +k-1 : +k; const vals={}; ["lWeight","lWaist","lSteps","lMeals","lSbp","lDbp","lGlu"].forEach(id=>vals[id]=$("#"+id).value); render(); Object.entries(vals).forEach(([id,v])=>$("#"+id).value=v); break; }
    case "gluType": { const vals={}; ["lWeight","lWaist","lSteps","lMeals","lSbp","lDbp","lGlu"].forEach(id=>vals[id]=$("#"+id).value); S.gluType=k; render(); Object.entries(vals).forEach(([id,v])=>$("#"+id).value=v); break; }
    case "saveLog": saveLog(); break;
    case "logView": S.logView=k; render(); break;
    case "waistHelp": { const c=LIB.find(s=>s.id==="monitor").cards[0]; layer(`<div class="sheet"><h2>${esc(c[0])}</h2><p style="font-size:17px;margin-top:10px">${nl(c[1])}</p><button class="btn block" data-act="closeLayer">تمام</button></div>`); break; }
    case "send": sendChat($("#chatIn").value); break;
    case "chipAsk": sendChat(el.dataset.q); break;
    case "openSec": S.lib=k; S.libIdx=0; S.tab="lib"; render(); break;
    case "libBack": S.lib=null; render(); break;
    case "libPrev": S.libIdx--; render(); break;
    case "libNext": S.libIdx++; render(); break;
    case "libRead": p.read=p.read||[]; if(!p.read.includes(k)){ p.read.push(k); addPoints(p,5,"read"); Store.put(p).catch(()=>{}); toast("+5 نقاط"); } if(S.libIdx < LIB.find(s=>s.id===S.lib).cards.length-1) S.libIdx++; render(); break;
    case "tts": speak(el.dataset.t); break;
    case "theme": { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; break; }
    case "openResearcher": openResearcher(); break;
    case "rExit": S.screen = S.p? "main":"login"; S.rSel=null; if(S.p){ const fresh=await Store.get(S.p.code); if(fresh) S.p=fresh; route(); } else render(); break;
    case "rTab": S.rTab=k; S.rSel=null; render(); break;
    case "rCreate": createCodes(); break;
    case "rUnlock": rUpdate(k,x=>x.postUnlocked=nowISO()); break;
    case "rUnlockAll": { for(const x of S.rData){ if(x.pre && !x.post && !x.postUnlocked){ x.postUnlocked=nowISO(); await Store.put(x); } } await loadR(); render(); toast("تم فتح القياس البعدي"); break; }
    case "rFull": rUpdate(k,x=>x.fullAccess=true); break;
    case "rPin": await rUpdate(k,x=>{ delete x.pinHash; }); toast("تم مسح الرقم السري. المشارك هيختار رقم جديد في الدخول الجاي."); break;
    case "rClin": S.rSel=k; S.rTp="pre"; render(); break;
    case "rBack": S.rSel=null; render(); break;
    case "rTp": S.rTp=k; render(); break;
    case "rSaveClin": saveClinical(); break;
    case "rReview": rUpdate(k,x=>{ x.alerts[+el.dataset.i].reviewed=true; }); break;
    case "rExport": doExport(); break;
    case "rRamadan": S.settings.ramadan=!S.settings.ramadan; await Store.putSettings(S.settings); render(); break;
  }
}

/* ================= Error safety ================= */
function showFatal(msg){ S.busy=false; const d=document.createElement("div"); d.className="toast"; d.style.background="var(--high)"; d.style.top="auto"; d.style.bottom="100px"; d.textContent="حصل خطأ: "+msg; document.body.appendChild(d); setTimeout(()=>d.remove(),8000); }
window.addEventListener("error", e=>showFatal((e.message||"خطأ غير معروف").slice(0,140)));
window.addEventListener("unhandledrejection", e=>{ const r=e.reason; const m=(r&&(r.code||r.message))||String(r); if(m==="timeout"||(r&&r.code)) showFatal("الحفظ اتأخر ("+m+")"); });

/* ================= Boot ================= */
async function boot(){
  S.screen="login"; render();
  if(window.claude && typeof window.claude.use==="function"){
    Cap.runtime=true;
    const tmo=(pr,ms,fb)=>Promise.race([pr,new Promise(r=>setTimeout(()=>r(fb),ms))]);
    const get=n=>tmo(window.claude.use(n).catch(()=>null),6000,null);
    const [db,user,sample,downloads]=await Promise.all([get("db"),get("user"),get("sample"),get("downloads")]);
    Cap.db=db; Cap.user=user; Cap.sample=sample; Cap.downloads=downloads;
    if(db) Store.mode="db";
    Cap.isOwner=null; if(user){ Promise.resolve().then(()=>user.isOwner()).then(v=>{ Cap.isOwner=v; }).catch(()=>{}); }
  }
  Cap.ready=true; render();
  S.settings = await Store.getSettings();
  const code=session();
  if(code){ try{ const p=await Store.get(code); if(p){ S.p=p; route(); return; } }catch(e){} }
  render();
}
boot();
